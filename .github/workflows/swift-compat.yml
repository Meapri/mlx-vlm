name: Swift Compatibility

on:
  pull_request:
    paths:
      - 'swift/**'
      - '.github/workflows/swift-compat.yml'
  push:
    branches:
      - main
      - 'feat/**'
    paths:
      - 'swift/**'
      - '.github/workflows/swift-compat.yml'

jobs:
  swift-test:
    name: SwiftPM tests
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Run Swift tests
        working-directory: swift
        run: swift test -Xswiftc -strict-concurrency=minimal
